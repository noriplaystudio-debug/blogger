          )
          archive=base64.b64decode(encoded,validate=True)
          expected='498614f1c438b0bdaafd76f274ff2ba1d17c179930415d18acc9ed9a299a0add'
          if hashlib.sha256(archive).hexdigest()!=expected:
              raise SystemExit('QA source checksum mismatch')
          base=Path('seed-market');base.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as tar:
              for member in tar.getmembers():
                  path=Path(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts or {'node_modules','.sites-runtime','.git'}&set(path.parts):
                      raise SystemExit('Unexpected QA archive path')
                  if path.name.startswith('.env') and path.name!='.env.example':
                      raise SystemExit('Runtime credentials must not be part of QA source')
              tar.extractall(base,filter='data')
          run_url='https://github.com/noriplaystudio-debug/blogger/actions/runs/'+os.environ['GITHUB_RUN_ID']
          (base/'.ci-source.json').write_text(json.dumps({'archiveSha256':expected,'version':'5.2.0','runUrl':run_url},indent=2)+'\n')
          history=Path('docs/PROJECT_HISTORY.md')
          text=history.read_text()
          marker='Seed QA source snapshot '+expected
          if marker not in text:
              date=datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
              note=('### '+date+' — Seed market QA source bootstrap\n'
                    '- 증상/요구: 사용자가 blogger 저장소에서 아이디어 마켓 자동 검증을 요청함.\n'
                    '- 확인 근거: '+marker+'; '+run_url+'\n'
                    '- 원인: 기존 Work는 브라우저 실행 전 차단됐으며 연결 도구의 파일 쓰기는 완료 확인을 받지 못함. 제품 결함은 아직 미확인.\n'
                    '- 변경: seed-market/ 소스를 QA 브랜치에만 등록. 기존 Blogger 앱·main·운영 데이터·예약 중단 상태 유지.\n'
                    '- 검증: 체크섬과 허용 파일 경로 확인. 실제 API·브라우저 결과는 위 Actions 실행에서 후속 확인.\n'
                    '- 배포: Blogger 운영 배포는 수행하지 않음.\n'
                    '- 후속 확인: doctor와 17단계 UI 결과·스크린샷·trace를 확인하기 전 QA-ENV-001을 닫지 않음.\n\n')
              text=text.replace('## 변경 기록\n','## 변경 기록\n\n'+note,1)
              lines=text.splitlines()
              lines=[('마지막 확인: '+date+' (Asia/Seoul)') if line.startswith('마지막 확인:') else line for line in lines]
              history.write_text('\n'.join(lines)+'\n')
          print('Restored '+str(101)+' QA source files; SHA-256 '+expected)

      - name: Register source only on the QA branch
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seed-market docs/PROJECT_HISTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "Register isolated Seed market QA source"
            git push origin HEAD:refs/heads/codex/seed-market-qa
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  browser-qa:
    needs: bootstrap
    if: github.repository == 'noriplaystudio-debug/blogger' && github.ref == 'refs/heads/codex/seed-market-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: seed-market
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SEED_QA_ARTIFACTS_DIR: .sites-runtime/qa-artifacts
      SEED_QA_BROWSER_IMAGE: github-hosted/ubuntu-24.04-preinstalled-chrome
      SEED_QA_SOURCE_SHA: ${{ needs.bootstrap.outputs.source-sha }}
    steps:
      - name: Checkout the QA commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.bootstrap.outputs.source-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"

      - name: Use Chrome already installed on the hosted runner
        shell: bash
        run: |
          SEED_QA_CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$SEED_QA_CHROME_BIN"
          printf 'SEED_BROWSER_EXECUTABLE=%s\n' "$SEED_QA_CHROME_BIN" >> "$GITHUB_ENV"
          "$SEED_QA_CHROME_BIN" --version

      - name: Install only the pinned Playwright driver
        timeout-minutes: 2
        run: npm install --prefix tools/browser-qa --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1

      - name: Static, API, database and QA tooling checks
        run: |
          npm run check
          npm test
          npm run qa:tools-test

      - name: Verify the browser and complete real UI journeys
        timeout-minutes: 7
        run: npm run qa:ci

      - name: Keep only generated QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-market-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: seed-market/.sites-runtime/qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
