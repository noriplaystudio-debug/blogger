name: Seed market browser QA

on:
  push:
    branches: ["codex/seed-market-qa"]
    paths: [".github/workflows/seed-market-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-market-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.repository == 'noriplaystudio-debug/blogger' && github.ref == 'refs/heads/codex/seed-market-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Checkout only the authorized QA branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Restore the reviewed source snapshot
        shell: python
        run: |
          import base64,gzip,hashlib,io,json,os,tarfile
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ.get('GITHUB_REPOSITORY')!='noriplaystudio-debug/blogger' or os.environ.get('GITHUB_REF')!='refs/heads/codex/seed-market-qa':
              raise SystemExit('This bootstrap is restricted to the authorized QA branch.')
          encoded=(
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
