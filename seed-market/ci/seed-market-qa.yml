name: Seed market browser QA

on:
  push:
    branches: ["codex/seed-market-qa"]
    paths:
      - "seed-market/**"
      - "!seed-market/docs/**"
      - "!seed-market/README.md"
      - ".github/workflows/seed-market-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-market-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    if: github.repository == 'noriplaystudio-debug/blogger' && github.ref == 'refs/heads/codex/seed-market-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: seed-market
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SEED_QA_ARTIFACTS_DIR: .sites-runtime/qa-artifacts
      SEED_QA_BROWSER_IMAGE: github-hosted/ubuntu-24.04-preinstalled-chrome
      SEED_QA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the QA commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"

      - name: Use Chrome already installed on the hosted runner
        shell: bash
        run: |
          SEED_QA_CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$SEED_QA_CHROME_BIN"
          printf 'SEED_BROWSER_EXECUTABLE=%s\n' "$SEED_QA_CHROME_BIN" >> "$GITHUB_ENV"
          "$SEED_QA_CHROME_BIN" --version

      - name: Install only the pinned Playwright driver
        timeout-minutes: 2
        run: npm install --prefix tools/browser-qa --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1

      - name: Ensure Korean text renders in QA screenshots
        timeout-minutes: 3
        shell: bash
        run: |
          if [ -z "$(fc-list :lang=ko family)" ]; then
            SEED_QA_FONT_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/fonts/seed-qa"
            mkdir -p "$SEED_QA_FONT_DIR"
            SEED_QA_FONT_BASE="https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78"
            curl --fail --location --connect-timeout 10 --max-time 45 --retry 1 --retry-max-time 60 --output "$SEED_QA_FONT_DIR/NotoSansKR-Regular.otf" "$SEED_QA_FONT_BASE/Sans/SubsetOTF/KR/NotoSansKR-Regular.otf"
            test "$(git hash-object "$SEED_QA_FONT_DIR/NotoSansKR-Regular.otf")" = "b8c11425a25c74dac1b51b28341ff1ef379f2ffa"
            curl --fail --location --connect-timeout 10 --max-time 45 --retry 1 --retry-max-time 60 --output "$SEED_QA_FONT_DIR/OFL.txt" "$SEED_QA_FONT_BASE/LICENSE"
            test "$(git hash-object "$SEED_QA_FONT_DIR/OFL.txt")" = "d952d62c065f3f35fb83a173496e90b21525aef3"
            fc-cache -f "$SEED_QA_FONT_DIR"
          fi
          SEED_QA_KOREAN_FONTS="$(fc-list :lang=ko family)"
          test -n "$SEED_QA_KOREAN_FONTS"
          printf '%s\n' "$SEED_QA_KOREAN_FONTS"

      - name: Static, API, database and QA tooling checks
        run: |
          npm run check
          npm test
          npm run qa:tools-test

      - name: Verify the browser and complete real UI journeys
        timeout-minutes: 7
        run: npm run qa:ci

      - name: Keep only generated QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-market-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: seed-market/.sites-runtime/qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Keep compact screenshots and result records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-market-qa-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            seed-market/.sites-runtime/qa-artifacts/**/summary.json
            seed-market/.sites-runtime/qa-artifacts/**/result.json
            seed-market/.sites-runtime/qa-artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 7
